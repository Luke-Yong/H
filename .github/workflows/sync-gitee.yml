name: Mirror to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        run: |
          git remote add gitee "https://Luke-Yong:${{ secrets.GITEE }}@gitee.com/Luke-Yong/Harness.git"
          git push gitee "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
